[project]
name = "ifc-qa"
version = "0.1.0"
description = "Lokalna aplikacja kontroli modeli IFC (demo IFC2X3)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.32.0",
    "ifcopenshell>=0.7.0",
    "pydantic>=2.0.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
